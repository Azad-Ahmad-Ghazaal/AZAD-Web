<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>AZAD — Personal AI</title><style>:root{--bg:#080b12;--panel:#10151f;--line:#263142;--text:#edf2f7;--muted:#91a0b5;--accent:#6ee7b7;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142033,#080b12 45%);color:var(--text);font:15px system-ui,sans-serif;height:100vh}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr;grid-template-rows:62px 1fr}.top{grid-column:1/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;background:#090d14}.brand{font-weight:800;font-size:20px}.brand span{color:var(--accent)}.status{margin-left:auto;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px}.off{background:var(--danger)}aside{border-right:1px solid var(--line);padding:18px;background:#0b1018}.new{width:100%;padding:11px;border:1px solid var(--line);background:#151c28;color:var(--text);border-radius:10px;cursor:pointer}.nav{margin-top:20px;color:var(--muted)}.nav div{padding:10px 8px}.active{color:var(--text);background:#172131;border-radius:8px}main{display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:30px max(18px,calc((100% - 850px)/2))}.welcome{text-align:center;margin:12vh auto;max-width:620px}.welcome h1{font-size:40px;margin:0 0 10px}.welcome p{color:var(--muted);line-height:1.6}.message{display:flex;gap:12px;margin-bottom:22px}.avatar{width:34px;height:34px;border-radius:10px;background:#1c2635;display:grid;place-items:center;flex:none}.user .avatar{background:#17382f;color:var(--accent)}.bubble{max-width:720px;line-height:1.65;white-space:pre-wrap}.meta{font-size:11px;color:var(--muted);margin-bottom:3px}.composer{padding:14px max(18px,calc((100% - 850px)/2)) 20px;border-top:1px solid var(--line);background:#090d14}.form{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px}.form input{flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:0 16px;background:var(--accent);font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}@media(max-width:700px){.app{grid-template-columns:1fr}.app aside{display:none}.welcome h1{font-size:32px}.messages{padding:20px 14px}.composer{padding:10px 12px 14px}}</style></head><body><div class="app"><header class="top"><div class="brand">A<span>Z</span>AD</div><div class="status"><i class="dot" id="dot"></i><span id="status">Checking…</span></div></header><aside><button class="new" id="new">＋ New conversation</button><div class="nav"><div class="active">💬 Chat</div><div>🤖 Bots</div><div>🎙️ Voice</div></div></aside><main><section class="messages" id="messages"><div class="welcome" id="welcome"><h1>Assalam-o-Alaikum, Uzair.</h1><p>I'm AZAD — your personal AI assistant. Connecting to the AZAD backend…</p></div></section><section class="composer"><form class="form" id="form"><input id="input" autocomplete="off" placeholder="Message AZAD…"><button class="btn" id="send">Send</button></form><div class="hint">AZAD Web • Vercel frontend</div></section></main></div><script>const $=s=>document.querySelector(s),box=$('#messages'),input=$('#input'),send=$('#send');const backend='https://ideal-engine-gxgwvg4vq95h96w6-5000.app.github.dev'.replace(/\/$/,'');function api(p){return backend+p}function add(role,text){$('#welcome')?.remove();const r=document.createElement('div');r.className='message '+role;r.innerHTML='<div class="avatar">'+(role==='user'?'U':'A')+'</div><div><div class="meta">'+(role==='user'?'You':'AZAD')+'</div><div class="bubble"></div></div>';r.querySelector('.bubble').textContent=text;box.appendChild(r);box.scrollTop=box.scrollHeight;return r.querySelector('.bubble')}async function health(){try{const r=await fetch(api('/api/v1/health'),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();$('#status').textContent=d.status==='ready'?'Online':(d.status==='ready_with_warnings'?'Online with warnings':'Degraded');$('#dot').classList.toggle('off',d.status!=='ready'&&d.status!=='ready_with_warnings')}catch(e){$('#status').textContent='Backend offline';$('#dot').classList.add('off')}}async function chat(text){send.disabled=true;const out=add('assistant','Thinking…');try{const r=await fetch(api('/api/v1/chat'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw Error(d.error||'Request failed');out.textContent=d.response||'No response returned.'}catch(e){out.textContent='Error: '+e.message}finally{send.disabled=false;input.focus()}}$('#form').onsubmit=e=>{e.preventDefault();const t=input.value.trim();if(t){input.value='';add('user',t);chat(t)}};$('#new').onclick=()=>{box.innerHTML='<div class="welcome" id="welcome"><h1>New conversation</h1><p>What would you like AZAD to do?</p></div>';input.focus()};health();</script></body></html>
